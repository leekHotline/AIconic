<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ec4899" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="10" y="10" width="100" height="50" rx="24" fill="#fff" opacity="0.15"/>
  <g filter="url(#glow)"><rect x="40" y="40" width="40" height="40" rx="8" fill="#fff" opacity="0.12"/>
