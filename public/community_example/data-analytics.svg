<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#c2410c" flood-opacity="0.35"/>
    </filter>
    <filter id="innerGlow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#fff" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="24" fill="url(#bg3)" filter="url(#shadow3)"/>
  <rect x="10" y="10" width="100" height="45" rx="24" fill="#fff" opacity="0.12"/>
  
  <g filter="url(#innerGlow)">
    <rect x="24" y="68" width="18" height="26" rx="5" fill="url(#barGrad)"/>
    <rect x="51" y="50" width="18" height="44" rx="5" fill="url(#barGrad)"/>
    <rect x="78" y="32" width="18" height="62" rx="5" fill="url(#barGrad)"/>
  </g>
  
  <polyline points="33,58 60,40 87,24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  
  <circle cx="33" cy="58" r="5" fill="#fff"/>
  <circle cx="60" cy="40" r="5" fill="#fff"/>
  <circle cx="87" cy="24" r="5" fill="#fff"/>
  
  <circle cx="33" cy="58" r="2.5" fill="#ea580c"/>
  <circle cx="60" cy="40" r="2.5" fill="#ea580c"/>
  <circle cx="87" cy="24" r="2.5" fill="#ea580c"/>
</svg>